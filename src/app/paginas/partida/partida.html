@if (sessao.partida(); as partidaAtual) {
  <app-batalha
    [partida]="partidaAtual"
    [pontuacao]="sessao.pontuacao()"
    [modo]="modo()"
    [tempoRestanteInicial]="sessao.tempoRestante()"
    (resultadoFinalizado)="registrarResultado($event)"
    (estadoPartidaAlterado)="sessao.salvarPartidaEmAndamento($event)"
    (novaPartidaSolicitada)="novaPartida()"
    (inicioSolicitado)="voltarParaInicio()"
  />
}
