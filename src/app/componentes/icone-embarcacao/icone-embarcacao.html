@switch (tipo()) {
  @case (tipos.PortaAvioes) {
    <svg
      lucidePlane
      class="icone"
      [class.icone--compacto]="tamanho() === 'compacto'"
      aria-hidden="true"
    ></svg>
  }
  @case (tipos.Encouracado) {
    <svg
      lucideShip
      class="icone"
      [class.icone--compacto]="tamanho() === 'compacto'"
      aria-hidden="true"
    ></svg>
  }
  @case (tipos.Cruzador) {
    <svg
      lucideNavigation
      class="icone"
      [class.icone--compacto]="tamanho() === 'compacto'"
      aria-hidden="true"
    ></svg>
  }
  @case (tipos.Submarino) {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="icone"
      [class.icone--compacto]="tamanho() === 'compacto'"
      aria-hidden="true"
    >
      <path d="M3 15h18a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
      <path d="M8 15v-3h7l2 3"></path>
      <path d="M11 12V8h4v4"></path>
      <path d="M15 8V6h3"></path>
      <path d="M7 17h.01M10 17h.01M13 17h.01"></path>
    </svg>
  }
  @default {
    <svg
      lucideBomb
      class="icone"
      [class.icone--compacto]="tamanho() === 'compacto'"
      aria-hidden="true"
    ></svg>
  }
}
