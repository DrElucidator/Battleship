<div class="flex min-h-screen flex-col">
  <header class="border-b border-celula-borda bg-celula/95 shadow-sm backdrop-blur">
    <div class="mx-auto flex min-h-16 w-full max-w-[84rem] items-center px-4">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex cursor-pointer items-center gap-3 rounded-xl px-2 py-1 text-left transition-colors hover:bg-agua/10 hover:text-agua focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-agua"
          aria-label="Voltar ao início"
          (click)="voltarParaInicio()"
        >
          <span
            class="grid size-9 place-items-center rounded-xl bg-embarcacao text-white shadow-sm"
          >
            <svg lucideShip class="size-5" aria-hidden="true"></svg>
          </span>
          <h1 class="text-lg font-bold tracking-tight">{{ nomeJogo() }}</h1>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[84rem] flex-1 px-4 py-4">
    @if (etapa() === 'apresentacao') {
      <app-apresentacao-inicial
        [modo]="modoPartida()"
        (modoAlterado)="selecionarModo($event)"
        (preparacaoIniciada)="iniciarPreparacao()"
      />
    } @else if (etapa() === 'trocaParaPreparacaoJogadorDois') {
      <app-troca-jogador
        [participante]="participantes.JogadorDois"
        titulo="A frota do Jogador 1 está protegida"
        descricao="Passe o dispositivo. O Jogador 2 deve posicionar sua frota sem visualizar o tabuleiro anterior."
        (confirmada)="prepararJogadorDois()"
      />
    } @else if (partida(); as partidaAtual) {
      <app-batalha
        [partida]="partidaAtual"
        [pontuacao]="pontuacao()"
        [modo]="modoPartida()"
        (resultadoFinalizado)="registrarResultado($event)"
        (novaPartidaSolicitada)="iniciarNovaPartida()"
        (inicioSolicitado)="voltarParaInicio()"
      />
    } @else {
      @if (etapa() === 'preparacaoJogadorUm') {
        <app-preparacao-frota
          jogador="Jogador 1"
          [botaoFinal]="
            modoPartida() === modos.Local ? 'Passar para o Jogador 2' : 'Iniciar batalha'
          "
          (batalhaIniciada)="concluirPreparacaoJogadorUm($event)"
        />
      } @else {
        <app-preparacao-frota
          jogador="Jogador 2"
          botaoFinal="Iniciar batalha"
          (batalhaIniciada)="concluirPreparacaoJogadorDois($event)"
        />
      }
    }
  </main>
</div>
