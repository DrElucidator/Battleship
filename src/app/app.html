<div class="flex min-h-screen flex-col">
  <header class="border-b border-celula-borda bg-celula/95 shadow-sm backdrop-blur">
    <div class="mx-auto flex min-h-16 w-full max-w-5xl items-center px-4">
      <div class="flex items-center gap-3">
        <span class="grid size-9 place-items-center rounded-xl bg-embarcacao text-white shadow-sm">
          <svg lucideShip class="size-5" aria-hidden="true"></svg>
        </span>
        <h1 class="text-lg font-bold tracking-tight">{{ nomeJogo() }}</h1>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6">
    @if (etapa() === 'apresentacao') {
      <app-apresentacao-inicial (preparacaoIniciada)="iniciarPreparacao()" />
    } @else if (partida(); as partidaAtual) {
      <app-batalha
        [partida]="partidaAtual"
        [pontuacao]="pontuacao()"
        (resultadoFinalizado)="registrarResultado($event)"
        (novaPartidaSolicitada)="iniciarNovaPartida()"
      />
    } @else {
      <app-preparacao-frota (batalhaIniciada)="iniciarBatalha($event)" />
    }
  </main>
</div>
